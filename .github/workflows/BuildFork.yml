name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      force:
        description: Build even if this upstream commit was already built
        type: boolean
        default: false
      release:
        description: Create a release with the patch features as changelog
        type: boolean
        default: false

permissions:
  contents: write

env:
  UPSTREAM: AcideFluorhydrique/geminiAssist
  UPSTREAM_BRANCH: main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check upstream
        id: up
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git ls-remote "https://github.com/$UPSTREAM.git" "refs/heads/$UPSTREAM_BRANCH" | cut -f1)
          [ -n "$sha" ] || { echo "Could not read upstream head"; exit 1; }
          psha=$(cat patch.py patch2.py $(find assets -type f | sort) | sha256sum | cut -c1-6)
          tag="up-${sha:0:7}-p$psha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ "${{ inputs.force }}" != "true" ] && gh release view "$tag" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Already built: $tag"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Clone upstream
        if: steps.up.outputs.skip != 'true'
        run: |
          git clone --depth 1 --branch "$UPSTREAM_BRANCH" "https://github.com/$UPSTREAM.git" upstream
          git -C upstream checkout --quiet ${{ steps.up.outputs.sha }}

      - name: Apply patch
        if: steps.up.outputs.skip != 'true'
        run: |
          python3 patch.py upstream
          python3 patch2.py upstream

      - name: Read version
        id: ver
        if: steps.up.outputs.skip != 'true'
        run: |
          g=upstream/app/build.gradle
          name=$(sed -nE 's/^[[:space:]]*versionName[[:space:]]+"([^"]+)".*/\1/p' "$g" | head -n1)
          code=$(sed -nE 's/^[[:space:]]*versionCode[[:space:]]+([0-9]+).*/\1/p' "$g" | head -n1)
          [ -n "$name" ] && [ -n "$code" ] || { echo "Could not read version from $g"; exit 1; }
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "apk=Gemini-Lite-v$name.apk" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        if: steps.up.outputs.skip != 'true'
        with:
          java-version: 17
          distribution: temurin
          cache: gradle
          cache-dependency-path: |
            upstream/**/*.gradle*
            upstream/gradle/wrapper/gradle-wrapper.properties

      - name: Build debug APK
        if: steps.up.outputs.skip != 'true'
        working-directory: upstream
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Collect APK
        if: steps.up.outputs.skip != 'true'
        env:
          APK: ${{ steps.ver.outputs.apk }}
        run: |
          mkdir out
          cp upstream/app/build/outputs/apk/debug/*.apk "out/$APK"

      - name: Upload APK
        if: steps.up.outputs.skip != 'true'
        uses: actions/upload-artifact@v7
        with:
          path: out/${{ steps.ver.outputs.apk }}
          archive: false

      - name: Write changelog
        if: steps.up.outputs.skip != 'true' && (github.event_name != 'workflow_dispatch' || inputs.release)
        env:
          VNAME: ${{ steps.ver.outputs.name }}
          VCODE: ${{ steps.ver.outputs.code }}
          SHA: ${{ steps.up.outputs.sha }}
        run: |
          cat > notes.md <<EOF
          - **Version:** $VNAME (build $VCODE)
          - **Upstream commit:** [${SHA:0:7}](https://github.com/$UPSTREAM/commit/$SHA)

          ### Changes

          - **All URLs allowed.** Allowlist, request blocking and HTTPS-only rule removed.
          - **Toggle button removed.** Hand button, swipe-to-hide, drag logic and long-press reset chat removed.
          - **Link long-press URL copy removed.** Image long-press and saving unchanged.
          - **Google sign-in fixed.** Mobile user agent applied at startup, with WebView markers (wv, Version/x) stripped.
          - **No desktop popover.** Desktop-style Linux user agent dropped, so Gemini keeps its mobile layout.
          - **Element blocker.** Button right of the profile icon. Tap elements to hide them, rules saved on the device.
          - **Renamed to Gemini-Lite** with a new launcher icon (legacy, adaptive and themed).
          - **System bars follow the page.** Status and navigation bars take Gemini's light or dark background instead of black.
          - **Multiple photos and files.** The picker uses the page's accept types and allows multi-select.
          - **Digital assistant.** Listed under Default digital assistant app. Home long-press opens the app with the prompt focused.
          - **Static file cache.** Gemini's scripts, fonts and images from gstatic.com are kept on disk (up to 256 MB, 30 days). Analytics and ad tags are blocked.
          EOF

      - name: Publish release
        if: steps.up.outputs.skip != 'true' && (github.event_name != 'workflow_dispatch' || inputs.release)
        env:
          GH_TOKEN: ${{ github.token }}
          VNAME: ${{ steps.ver.outputs.name }}
          APK: ${{ steps.ver.outputs.apk }}
          SHA: ${{ steps.up.outputs.sha }}
        run: |
          tag="${{ steps.up.outputs.tag }}"
          gh release delete "$tag" --cleanup-tag --yes 2>/dev/null || true
          gh release create "$tag" "out/$APK" \
            --title "Gemini-Lite v$VNAME (${SHA:0:7})" \
            --notes-file notes.md \
            --latest
